server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Arquivos com hash no nome: cache longo.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000";
  }

  # Rotas dinâmicas do Expo Router: o export gera um modelo [param].html por rota.
  location ~ ^/market/[^/]+$ { rewrite ^ /market/[id].html last; }
  location ~ ^/order/[^/]+$ { rewrite ^ /order/[id].html last; }
  location ~ ^/product/[^/]+$ { rewrite ^ /product/[id].html last; }
  location ~ ^/review/[^/]+$ { rewrite ^ /review/[orderId].html last; }

  # Demais rotas: /login -> login.html, / -> index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /+not-found.html;
}
